---
# Test docs: https://github.com/helm-unittest/helm-unittest/blob/main/DOCUMENT.md
suite: test clusterrole
values:
- ../test_values.yaml
templates:
- clusterrole.yaml
tests:
- it: "renders the ClusterRole with correct rules"
  set:
    clusterRole.create: true
  asserts:
  - isKind:
      of: ClusterRole
  - matchRegex:
      path: metadata.name
      pattern: -ggscout$
- it: "grants read access to the External Secrets Operator resources"
  set:
    clusterRole.create: true
  asserts:
  - contains:
      path: rules
      content:
        apiGroups: ["external-secrets.io"]
        resources: ["externalsecrets"]
        verbs: ["get", "list"]
  - contains:
      path: rules
      content:
        apiGroups: ["external-secrets.io"]
        resources: ["secretstores"]
        verbs: ["get", "list"]
  - contains:
      path: rules
      content:
        apiGroups: ["external-secrets.io"]
        resources: ["clustersecretstores"]
        verbs: ["get", "list"]
- it: "does not create a ClusterRole"
  set:
    clusterRole.create: false
  asserts:
  - hasDocuments:
      count: 0
